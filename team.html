<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Meet the talented professionals at Black Pearl Solutions.">
        <meta property="og:title" content="Team">
        <meta property="og:type" content="website">
        <meta property="og:description" content="Meet the talented professionals at Black Pearl Solutions.">
        <meta property="og:url" content="https://example.com/team.html">
        <meta property="og:image" content="https://example.com/images/black-pearl-preview.jpg">
        <meta property="og:site_name" content="Black Pearl Solutions">
        <title>Team</title>
        <link rel="stylesheet" href="./css/main.css">
    </head>
    <body>
        <header class="navbar">
            <button
                type="button"
                id="nav-toggle"
                class="hamburger"
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="mobile-nav"
            >
                &#9776;
            </button>

            <nav id="mobile-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="team.html" aria-current="page">Team</a>
                <a href="contact.html">Contact</a>
                <a href="gallery.html">Gallery</a>
                <button type="button" id="dark-mode-toggle" aria-pressed="false">
                    Dark mode
                </button>
            </nav>
            <div id="nav-overlay"></div>
        </header>

        <main>
            <section aria-labelledby="team-heading">
                <h1 id="team-heading">Meet Our Team</h1>
                <p>Discover the talented professionals behind Black Pearl Solutions.</p>
            </section>

            <nav class="department-filters" aria-label="Team department filter">
                <label for="department-filter">Filter by Department:</label>
                <select id="department-filter">
                    <option value="all">All Departments</option>
                    <option value="Engineering and Technology">
                        Engineering and Technology
                    </option>
                    <option value="Business and Operations">
                        Business and Operations
                    </option>
                </select>
            </nav>

            <section class="team-grid" aria-labelledby="team-list-heading">
                <h2 id="team-list-heading">Our Team</h2>

                <p id="team-loading" role="status" hidden>
                    Loading team members...
                </p>

                <div id="team-error" hidden>
                    <p id="team-error-message" role="alert"></p>
                    <button type="button" id="team-retry">Retry</button>
                </div>

                <p id="team-no-results" hidden>No team members found.</p>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 Black Pearl Solutions. All rights reserved.</p>
            <p><a href="contact.html">Contact us</a></p>
        </footer>

        <script type="module" src="./js/main.js"></script>

        <button type="button" id="back-to-top" aria-label="Back to top">
            &uarr;
        </button>
    </body>
</html>
